name: Phase 9 cross-platform upgrade

on:
  pull_request:
    paths:
      - "harness_manager/**"
      - "tests/test_install_profiles.py"
      - "tests/test_upgrade_cross_platform.py"
      - ".github/workflows/phase9-cross-platform.yml"

permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify upgrade backend
        run: python -m unittest discover -s tests -p "test_upgrade_cross_platform.py"
      - name: Compile migration modules
        run: python -m py_compile harness_manager/upgrade.py harness_manager/state.py
